name: Refresh IPO data

on:
  schedule:
    - cron: "*/30 2-17 * * *"   # every 30 min, 07:30-23:30 IST
    - cron: "30 20 * * *"       # one overnight check at 02:00 IST
  workflow_dispatch:            # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-ipo
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Fetch live IPO + GMP data
        run: python3 fetch_ipo.py

      - name: Commit if the data changed
        run: |
          git config user.name  "ipo-gmp-bot"
          git config user.email "ipo-gmp-bot@users.noreply.github.com"
          git add ipo.json history.json
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "data: refresh $(TZ=Asia/Kolkata date +'%d %b %H:%M') IST"
            git pull --rebase --autostash
            git push
          fi
